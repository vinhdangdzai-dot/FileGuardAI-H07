{% extends "base.html" %}{% block content %}
<div class="panel text-center py-5"><div class="display-3 fw-bold text-danger">{{code}}</div>
<h1 class="h4">{{ 'Truy cập bị từ chối' if code == 403 else 'Không tìm thấy tệp' if code == 404 else 'Dịch vụ tạm thời gián đoạn' }}</h1>
<p class="text-secondary">{{message}}</p><a href="{{url_for('index')}}" class="btn btn-primary">Về trang chủ</a></div>
{% endblock %}
