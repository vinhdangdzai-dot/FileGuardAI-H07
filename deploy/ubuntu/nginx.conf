server {
    listen 80;
    listen [::]:80;
    server_name canhgacso.fun www.canhgacso.fun;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host canhgacso.fun;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_buffering on;
    }

    # Flask has no static route for these paths; deny them again at the proxy.
    # Do not block /.well-known/acme-challenge, which Certbot needs.
    location ~ ^/(?:\.env(?:/|$)|\.git(?:/|$)|instance(?:/|$)|artifacts(?:/|$)|data(?:/|$)) {
        deny all;
    }
}
